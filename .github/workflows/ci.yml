name: Spring Boot CI

on:
  push:
    branches: [ "main", "fix-issues-and-tests" ]
  pull_request:
    branches: [ "main", "fix-issues-and-tests" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Test with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
      
    - name: Run Tests
      run: ./gradlew test

    - name: Build Project
      run: ./gradlew build -x test

    - name: Start server for API tests
      run: |
        java -jar build/libs/*.jar &
        echo $! > /tmp/server.pid
        # Wait for server to be ready
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/items/all >/dev/null 2>&1; then
            echo "Server ready after ${i}s"
            break
          fi
          sleep 1
        done
        # Seed admin user
        curl -sf -X POST http://localhost:8080/login \
          -H "Content-Type: application/json" \
          -d '{"username":"admin","password":"admin"}' >/dev/null 2>&1 || \
        curl -s -X POST http://localhost:8080/register \
          -H "Content-Type: application/json" \
          -d '{"username":"admin","displayName":"Administrator","password":"admin"}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: pip install pytest requests

    - name: Run API tests
      run: |
        python -m pytest tests_api/ -v --tb=short
      env:
        API_BASE_URL: http://localhost:8080
        ADMIN_USERNAME: admin
        ADMIN_PASSWORD: admin

    - name: Stop server
      if: always()
      run: kill $(cat /tmp/server.pid) 2>/dev/null || true
